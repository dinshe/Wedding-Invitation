name: Deploy Wedding Digital Invitation to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename standalone.html to index.html for GitHub Pages
        run: |
          cp standalone.html _site_index.html
          mkdir -p _site
          cp standalone.html _site/index.html
          # Copy any other assets if they exist
          if [ -d "public" ]; then
            cp -r public/. _site/
          fi
          if [ -d "assets" ]; then
            cp -r assets/. _site/assets/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
